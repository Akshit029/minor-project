region:
  name: "Jammu and Kashmir"
  north: 38.0
  south: 31.0
  west: 73.0
  east: 81.0

districts:
  Srinagar:
    lat: 34.0837
    lon: 74.7973
  Jammu:
    lat: 32.7266
    lon: 74.8570
  Anantnag:
    lat: 33.7311
    lon: 75.1487
  Baramulla:
    lat: 34.2090
    lon: 74.3429

gfs:
  start_date: "2026-09-15"
  end_date: "2026-09-19"
  cycles: ["00", "06", "12", "18"]
  max_forecast_hour: 168
  forecast_interval: 3
  variables:
    temperature: "TMP:2 m above ground"
    precipitation: "APCP:surface"
  test_mode:
    start_date: "2026-09-15"
    end_date: "2026-09-15"
    cycles: ["00"]
    max_forecast_hour: 12
    forecast_interval: 3

era5:
  start_date: "2026-01-01"
  end_date: "2026-08-31"
  variables:
    - "2m_temperature"
    - "total_precipitation"
  test_mode:
    start_date: "2026-09-15"
    end_date: "2026-09-16"

anomaly:
  z_threshold: 3.0
  robust_z_threshold: 3.5

quality:
  temp_min_c: -40.0
  temp_max_c: 55.0
  precip_min_mm: 0.0
  precip_max_mm: 500.0

output_dirs:
  raw_gfs: "data/raw/gfs"
  raw_era5: "data/raw/era5"
  processed: "data/processed"
  figures: "outputs/figures"
  tables: "outputs/tables"
  reports: "outputs/reports"
  week3: "outputs/week3"
  week3_figures: "outputs/week3/figures"
  week4: "outputs/week4"
  week4_figures: "outputs/week4/figures"
  week5: "outputs/week5"
  week5_figures: "outputs/week5/figures"

week3:
  lead_days_range: [1, 10]
  hours_per_lead_day: 24
  min_samples_district: 3
  min_samples_bias_correction: 4
  bias_correction_train_split: 0.70
  check_pressure: true
  enable_precip_bias_correction: false

week4:
  error_scale:
    temperature_c: 2.0   # °C acceptable tolerance (engineering default)
    precipitation_mm: 5.0 # mm tolerance
  variable_weights:
    temperature_c: 1.0
    precipitation_mm: 0.5
  confidence_k: 10.0     # Sample confidence factor parameter k
  min_evidence_samples: 3
  temporal_split_ratio: 0.70

week5:
  bust_quantile: 0.90    # Upper 90th percentile of training absolute error
  min_samples_threshold: 4
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  classification_threshold: 0.50
