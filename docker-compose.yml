services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-reliability-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ALERT_THRESHOLD=${ALERT_THRESHOLD:-0.60}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.0-flash}
      - MPLCONFIGDIR=/tmp/matplotlib
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - weather-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weather-reliability-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - weather-net

networks:
  weather-net:
    driver: bridge

